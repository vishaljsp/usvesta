services:
  - type: web
    name: usvesta
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cloth_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
