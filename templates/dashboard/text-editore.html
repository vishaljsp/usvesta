    <!-- Modals -->
    <!-- Link Modal -->
    <div id="linkModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Insert Link</h3>
            <form id="linkForm">
                <div class="form-group">
                    <label for="linkUrl">URL</label>
                    <input type="url" id="linkUrl" placeholder="https://example.com" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="cancelLinkBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Insert</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Image Modal -->
    <div id="imageModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Insert Image</h3>
            <form id="imageForm">
                <div class="form-group">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" id="imageUrl" placeholder="https://source.unsplash.com/random">
                </div>
                <div class="image-dimensions">
                    <div class="form-group">
                        <label for="imageWidth">Width (px)</label>
                        <input type="number" id="imageWidth" placeholder="Optional">
                    </div>
                    <div class="form-group">
                        <label for="imageHeight">Height (px)</label>
                        <input type="number" id="imageHeight" placeholder="Optional">
                    </div>
                </div>
                <div class="divider-text">OR</div>
                <div class="form-group">
                    <label for="imageUpload">Upload from computer</label>
                    <input type="file" id="imageUpload" accept="image/*">
                </div>
                <div class="modal-buttons">
                    <button type="button" id="cancelImageBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Insert Image</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Table Modal -->
    <div id="tableModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Create Table</h3>
            <form id="tableForm">

                    <input type="number" id="tableRows" value="3" min="1" required>
                </div>
